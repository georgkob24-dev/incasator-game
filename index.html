.drive #city,.drive #road::after{animation-play-state:running}.drive #vanbox{animation:bob .3s ease-in-out infinite}.drive .wh{animation-play-state:running!important}
.shake{animation:shake .4s}

}

function audioUnlock(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!audioCtx)audioCtx=new A();if(audioCtx.state==='suspended')audioCtx.resume();if(!musicTimer)musicTimer=setInterval(musicTick,220)}catch(e){}}
function tone(freq,dur,vol=.035,type='square'){
 if(!audioCtx||audioCtx.state!=='running')return;
 try{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(vol,now);gain.gain.setValueAtTime(vol*.5,now+dur*.6);gain.gain.setValueAtTime(0,now+dur);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+dur+.005)}catch(e){}
}

 const bass=[131,131,147,147,175,175,147,147];
 const n=musicStep++;
 if(n%2===0)tone(notes[n%16],.16,.018);
 if(n%4===0)tone(bass[Math.floor(n/4)%8],.31,.011,'triangle');
}

 // Двухтональный короткий «щелчок» с мягкой атакой.

 if(audioCtx&&audioCtx.state==='running'){
  try{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;
  osc.type='triangle';osc.frequency.setValueAtTime(660,now);osc.frequency.exponentialRampToValueAtTime(280,now+.065);
  gain.gain.setValueAtTime(.001,now);gain.gain.linearRampToValueAtTime(.033,now+.006);
  gain.gain.exponentialRampToValueAtTime(.001,now+.07);

 }

function chatWho(raw){const a=String(raw||'').toLowerCase();if(a.includes('саня'))return 'sanya';if(a.includes('макс')||a.includes('мониторинг'))return 'max';if(a.includes('лена'))return 'lena';if(a.includes('ден'))return 'den';if(a.includes('рабочий')||a.includes('экипаж'))return 'group';return 'sanya'}
function phoneSenderLabel(sender,mine){
 if(mine)return `${safeName()} · ИНКАССАТОР`;
 const who=chatWho(sender);
 if(who==='sanya')return 'САНЯ · ВОДИТЕЛЬ';
 if(who==='max')return 'МАКС · МОНИТОРИНГ';
 if(who==='lena')return 'ЛЕНА · КАССИР КИЦ';

function chatAvatar(id,small=false){const c=CONTACTS[id];return `<span class="chat-avatar ${small?'small':''}" style="background:${c.color}">${c.initials}</span>`}
function chatMessages(){return [...PHONE_SEED,...(META.messages||[])].map(([sender,body],i)=>({sender:String(sender),body:String(body),id:chatWho(sender),mine:sender.startsWith('Ты'),index:i})).map(m=>({...m,id:m.mine?chatWho(m.sender.replace(/^Ты\s*[·:]?\s*/,'')):m.id}))}

 el.innerHTML=`<div class="phone-shell"><div class="phone-status"><span>${S&&S.t?fmt(S.t):'09:41'}</span><span>●●● ▰</span></div><div class="phone-head"><button class="phone-icon-btn" onclick="${back?'openPhone()':'closeOverlay()'}">${back?'‹':'✕'}</button>${back?chatAvatar(back,true):'<span style="font-size:26px">📱</span>'}<div style="flex:1"><strong>${title}</strong><small>${subtitle}</small></div><button class="phone-icon-btn" onclick="closeOverlay()">⌂</button></div>${content}<div class="phone-home" onclick="closeOverlay()"></div></div>`;

function campaign(){if(!META.campaign)META.campaign={evidence:0,integrity:0,risk:0,career:0,careerMonitor:0,freedom:0,crime:'none',confessed:false,done:[],final:null};return META.campaign}
function campaignEventForDay(){const c=campaign(),d=META.chapter||1;return CAMPAIGN_EVENTS[d]&&!c.done.includes(d)?d:null}
function campaignShow(day){const ev=CAMPAIGN_EVENTS[day];if(!ev)return afterShift();S.busy=0;
 panel(`<div class="hero"><small>СЮЖЕТНАЯ КАМПАНИЯ · ГЛАВА ${day}/30</small><h1>${esc(ev.title)}</h1><p>Неделя ${Math.ceil(day/5)} · после смены</p></div><div class="msg"><small>${esc(ev.speaker)}</small>${esc(ev.body)}</div><h3>Твой ответ</h3>${ev.choices.map((ch,i)=>`<button class="card" onclick="campaignChoose(${day},${i})">${esc(ch[0])}</button>`).join('')}`)
}
function campaignChoose(day,i){
 const c=campaign();if(c.done.includes(day))return afterShift();
 const ev=CAMPAIGN_EVENTS[day],ch=ev.choices[i];if(!ch)return;
 const effects=ch[1];for(const [k,v] of Object.entries(effects)){
 if(k==='crew'||k==='monitor'||k==='management'||k==='pm')META.relations[k]=(META.relations[k]||0)+v;
 else if(k==='lena')META.relations.management=(META.relations.management||0)+v;
 else if(k==='promise')META.promises.push('Поддержать Саню до конца разбирательства');
 else if(k==='crime'||k==='confessed')c[k]=v;
 else c[k]=(c[k]||0)+v;
 }
 c.done.push(day);addChronicle(`${ev.title}: ${ch[0]}. ${ch[2]}`);
 META.messages.push([ev.speaker+' · после смены',ch[2]]);saveMeta();
 panel(`<h2>Последствия решения</h2><div class="msg"><small>${esc(ev.speaker)}</small>${esc(ch[2])}</div><p class="sub">Выбор сохранён. Его последствия могут проявиться спустя несколько смен.</p><button class="card btn" onclick="afterShift()">🌙 Продолжить вечер</button>`)
}
function campaignFinal(){
 const c=campaign();if(c.final)return showCareerEnding();
 const crew=META.relations.crew||0,mg=META.relations.management||0,mon=META.relations.monitor||0;
 let id='honest';
 if(c.crime==='involved'){
   if(c.confessed)id='confession';
   else if(c.risk>=5||c.evidence>=9)id='caught';
   else id='doublelife';
 }else if(c.crime==='reported'&&c.evidence>=8)id='whistleblower';
 else if(c.freedom>=5)id='leave';
 else if(c.careerMonitor>=3&&mon>=1)id='monitor';
 else if(c.career>=4&&mg>=1&&crew>=0&&c.integrity>=2)id='promotion';
 else if(c.evidence>=9&&c.integrity>=5)id='investigator';
 else if(crew<=-3)id='transfer';
 c.final=id;META.careerEnding=id;
 addChronicle('Финал шестинедельной истории: '+ENDINGS[id][0]);saveMeta();showCareerEnding()
}

const MAP_KIC={x:53,y:360};
function mapPoints(){return Array.from({length:NS},(_,i)=>{const col=i%5,row=Math.floor(i/5);return {x:75+col*99+(row%2?15:0),y:68+row*83+((i*13)%19-9)};})}

function mapArtwork(index,progress=0){const pts=mapPoints(),all=[MAP_KIC,...pts],from=all[index],to=all[index+1]||from;
const done=all.slice(0,index+1),road=mapPolyline(pts);

const grid=Array.from({length:9},(_,i)=>`<path d="M${i*69} 0V410 M0 ${i*52}H560" stroke="#58707a" stroke-width="12" opacity=".65"/>`).join('');
const pins=pts.map((p,i)=>{const completed=i<index,active=i===index;return `<g transform="translate(${p.x} ${p.y})"><circle r="${active?14:11}" fill="${completed?'#6ebf9b':active?'#e9bb77':'#253b4c'}" stroke="#f0e4c9" stroke-width="1.7"/><text text-anchor="middle" y="4" fill="${completed||active?'#172c38':'#f0e4c9'}" font-family="system-ui" font-size="10" font-weight="800">${i+1}</text></g>`}).join('');

 '«ПМ сказал, что клиент будет через пять минут. Пять минут назад говорил то же самое».',
 '«ПМ наконец дозвонился. Клиент сегодня не сможет. Заявку вовремя отменить забыли».'
 ][variant];panel(`<h2>📞 Мониторинг перезвонил</h2><p class="sub"><b>Макс:</b> ${pm}</p><p class="sub">«Без подтверждения не закрываем заявку как выполненную. Решение и время ожидания занесу в систему».</p>${variant===2?'':`<button class="card" onclick="absentResolution(0)"><span class="nm">⏳ Подождать ещё 10 минут и уточнить статус</span></button>`}<button class="card" onclick="absentResolution(1)"><span class="nm">📋 Зафиксировать отсутствие, ехать дальше по согласованию</span></button>`)}
function absentResolution(i){if(i===0){S.t+=10;if(Math.random()<.42){panel(`<h2>Клиент вышел на связь</h2><p class="sub">После согласования с мониторингом клиент появился. Теперь нужно проверить документы.</p><button class="card btn" onclick="docsStart()"><span class="nm">🪪 Проверить документы</span></button>`)}else{panel(`<h2>📞 Повторный звонок</h2><p class="sub">Макс: «ПМ опять обещал перезвонить. Не держу вас дальше. Отсутствие зафиксировано, следующая точка по утверждённому маршруту».</p><button class="card btn" onclick="absentResolution(1)"><span class="nm">➡️ Продолжить маршрут</span></button>`)}return}S.skipped++;rep(1);S.t+=4;S.pendingCallback=true;S.callbackDue=Math.min(NS,S.i+R(2,4));S.i++;hud();proceed()}
// Небольшая выборочная сверка для банкоматов; не повторяется на каждой точке.
function atmCheckStart(){const good=String(R(100,999));const other=String(Number(good)+R(1,7));S.atmTask={good,other,correct:R(0,1)};const choices=S.atmTask.correct?[other,good]:[good,other];panel(`<h2>🏧 Сверка кассеты</h2><p class="sub">Сверь номер кассеты с электронной заявкой перед подтверждением операции.</p><div class="doc"><strong>📱 Заявка</strong><div>Номер кассеты: ${good}</div><div>Статус: ожидает подтверждения</div></div>${choices.map((x,i)=>`<button class="card" onclick="atmCheckPick(${i})"><span class="nm">Кассета № ${x}</span></button>`).join('')}<button class="card" onclick="atmCheckIssue()"><span class="nm">📞 Номер не совпадает — запросить уточнение</span></button>`)}
async function atmCheckPick(i){if(S.busy)return;S.busy=1;S.atmChecks++;if(i!==S.atmTask.correct){S.mistakes++;rep(-6);S.t+=12;panel(`<h2>⚠️ Ошибка сверки</h2><p class="sub">Номер не соответствует заявке. Операция остановлена, мониторинг оформляет уточнение.</p><button class="card btn" onclick="next(0,false)"><span class="nm">➡️ Следующая точка</span></button>`);return}rep(2);await collect(S.rt[S.i].amt);next(1)}
function atmCheckIssue(){S.atmChecks++;S.monitorCalls++;S.t+=12;panel(`<h2>📞 Уточнение заявки</h2><p class="sub">Макс: «Вижу расхождение. Операцию пока не подтверждаем, фиксирую запрос на корректировку».</p><button class="card btn" onclick="next(0,false)"><span class="nm">📋 Оформить перенос и продолжить маршрут</span></button>`)}
// Редкий сюжетный инцидент. Только управленческие решения, без боевых инструкций.
function robberyStart(){S.monitorCalls++;panel(`<div class="ev">🚨</div><h2>Чрезвычайное происшествие</h2><p class="sub">Во время остановки экипаж столкнулся с попыткой ограбления. Ситуация опасная. Главное — безопасность экипажа и немедленное сообщение о происшествии.</p><button class="card btn" onclick="robberyReport()"><span class="nm">📞 Сообщить об угрозе и вызвать экстренную помощь</span></button>`)}
function robberyReport(){S.t+=R(15,30);panel(`<h2>📞 Экстренная связь</h2><p class="sub">Сообщение принято. Экстренные службы уведомлены, Cash-мониторинг остановил маршрут. Экипаж ожидает указаний и прибытия экстренных служб.</p><button class="card btn" onclick="robberyOutcome()"><span class="nm">Узнать исход происшествия</span></button>`)}
function robberyOutcome(){const x=R(0,3);const cases=[
 {title:'Угроза миновала',desc:'Подозреваемые скрылись, никто не пострадал. Экипаж передаёт сведения прибывшим службам.',delay:75,rep:3,fail:false},
 {title:'Экипаж не пострадал',desc:'Происшествие завершилось без травм. Маршрут прекращён, предстоит разбирательство.',delay:110,rep:1,fail:true},
 {title:'Материальные потери',desc:'Зафиксирована утрата части ценностей. Люди в безопасности, дальнейшие действия — у экстренных служб и руководства.',delay:130,rep:-4,fail:true},
 {title:'Пострадавшему требуется помощь',desc:'Один из членов экипажа получил травму. Медики прибыли, рабочая смена прекращена.',delay:150,rep:0,fail:true}
 ];const o=cases[x];S.t+=o.delay;S.robberyResult=o.title;rep(o.rep);if(!META.stories.includes('robbery'))META.stories.push('robbery');saveMeta();panel(`<div class="ev">🚨</div><h2>${o.title}</h2><p class="sub">${o.desc}</p><p class="sub">Время потеряно: ${o.delay} минут. Случай добавлен в коллекцию историй.</p><button class="card btn" onclick="${o.fail?'endDay(1)':'proceed()'}"><span class="nm">${o.fail?'📋 Завершить смену и оформить происшествие':'➡️ Продолжить после разрешения мониторинга'}</span></button>`)}


async function accident(){
 const sc=$('#scene');sc.classList.add('crash','shake','hit');
 S.t+=R(25,55);hurt(R(12,30));rep(-2);S.monitorCalls++;
 await sleep(550);sc.classList.remove('crash','shake','hit');
 const fl=S.rt.slice(S.i).filter(c=>c.priv).length;
 const hasFl=fl>0||S.flDone>0;
 S.shiftLog.push({kind:'accident',text:'ДТП на маршруте; сообщение мониторингу и оформление происшествия',resolved:true});
 addChronicle(`ДТП на маршруте. ${hasFl?'На оставшемся маршруте есть встречи с физическими лицами.':'Оставшихся встреч с физическими лицами нет.'}`);
 return new Promise(resolve=>{
  S.accidentResume=resolve;S.accidentFl=hasFl;S.accidentPhase=0;
  panel(`<div class="ev">💥</div><h2>ДТП на маршруте</h2><p class="sub">Машина остановилась. Экипаж проверил состояние людей и сообщил о происшествии. ${hasFl?'На маршруте есть встречи с физическими лицами.':'На оставшемся маршруте встреч с физическими лицами нет.'}</p><button class="card btn" onclick="accidentCall()"><span class="nm">📞 Позвонить в Cash-мониторинг</span></button>`);
  S.busy=0
 })
}
function accidentCall(){
 S.busy=0;
 const hasFl=S.accidentFl;
 panel(`<div class="ev">📞</div><h2>Cash-мониторинг · Макс</h2><div class="msg"><small>Макс</small>«Главное — все целы? Зафиксируйте ДТП и оставайтесь на месте. ${hasFl?'У вас есть физлица. Сейчас подъедет другой инкассаторский экипаж. Передачу ценностей организуем по согласованному порядку, с оформлением документов.':'По оставшимся точкам сейчас скорректируем окна и решим, сможет ли машина продолжить маршрут.'}»</div><button class="card btn" onclick="${hasFl?'accidentWait()':'accidentFinish(false)'}"><span class="nm">${hasFl?'⏳ Дождаться другого экипажа':'📋 Получить решение мониторинга'}</span></button>`)
}
function accidentWait(){
 S.t+=R(18,32);hud();
 panel(`<div class="ev">🚐</div><h2>Прибыл другой экипаж</h2><p class="sub">Мониторинг согласовал передачу ценностей и документов. Два экипажа оформляют передачу по учёту; после этого ответственность за принятые ценности переходит принимающему экипажу.</p><div class="msg"><small>Саня</small>«Хорошо, что замену нашли. Теперь всё оформить без спешки».</div><button class="card btn" onclick="accidentTransfer()"><span class="nm">📋 Подтвердить оформление передачи</span></button>`)
}
function accidentTransfer(){
 S.t+=12;S.transferDone=true;META.messages.push(['Макс · Cash-мониторинг','Замещающий экипаж прибыл. Передача ценностей по акту подтверждена.']);addChronicle('После ДТП ценности переданы прибывшему экипажу по согласованному порядку с оформлением документов.');saveMeta();hud();
 panel(`<div class="ev">✅</div><h2>Передача оформлена</h2><p class="sub">Ценности приняты другим экипажем. Дальнейший маршрут определяет мониторинг. Пострадавшая машина остаётся на месте для оформления происшествия.</p><button class="card btn" onclick="accidentFinish(true)"><span class="nm">📞 Получить дальнейшее распоряжение</span></button>`)
}
function accidentFinish(transferred){
 S.busy=1;
 if(transferred){
  S.shiftLog.push({kind:'transfer',text:'Передача ценностей замещающему экипажу после ДТП',resolved:true});
  S.shift+=20;S.t+=15;
  panel(`<h2>📞 Решение мониторинга</h2><p class="sub">Макс: «Ваш экипаж возвращается для оформления происшествия. Оставшиеся заявки перераспределим. Зафиксируйте завершение смены».</p><button class="card btn" onclick="accidentCloseShift()"><span class="nm">🏢 Завершить смену по ДТП</span></button>`);
 }else{
  S.t+=15;S.shift+=15;hud();
  panel(`<h2>📞 Решение мониторинга</h2><p class="sub">Макс: «Ситуацию зарегистрировали. Если машина и экипаж могут продолжать работу, действуйте по согласованному маршруту. Если нет — возвращайтесь в КИЦ».</p><button class="card btn" onclick="accidentContinue()"><span class="nm">Продолжить по разрешению мониторинга</span></button><button class="card" onclick="accidentCloseShift()"><span class="nm">Завершить смену и вернуться в КИЦ</span></button>`)
 }
}
function accidentContinue(){const resume=S.accidentResume;S.accidentResume=null;S.busy=1;if(resume)resume(false)}
function accidentCloseShift(){const resume=S.accidentResume;S.accidentResume=null;S.busy=1;if(resume)resume(true);endDay(1)}
async function chopEvent(){
 S.t+=30;rep(-1);
 const scenes=[
  ['guard','Парни, мне очень хреново. Кажется, я обосрался.'],
  ['driver','Да ладно, блядь. Ты сейчас серьёзно?'],
  ['guard','Я не шучу. Надо связываться с мониторингом.'],
  ['driver','Окна открывать нельзя. Ден, ну ты серьёзно сейчас?'],
  ['monitor','Понял. Остановитесь в безопасном месте, двери не открывайте без согласования. Организуем замену.'],
  ['driver','Макс, просто пришли замену. У нас тут находиться невозможно.'],
  ['guard','Парни, давайте без подробностей в общий чат.']
 ];
 for(const [who,line] of scenes){say('📞 '+CREW[who].name+': «'+line+'»');await sleep(1700)}
 hud()
}

</script></body></html>
