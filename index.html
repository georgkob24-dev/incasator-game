<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Смена инкассатора</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0}
:root{--y:#ffdd2d;--bg:#10131a;--card:#1b2030;--red:#ff4d5a;--g:#3ddc84}
body{background:var(--bg);color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column}
#scene{position:relative;height:220px;overflow:hidden;background:linear-gradient(#1d2b53,#7e4a6d 55%,#f6a05b);flex:none}
#sun{position:absolute;right:40px;top:34px;width:54px;height:54px;border-radius:50%;background:#ffd36b;box-shadow:0 0 40px #ffb347}
#city{position:absolute;left:0;bottom:56px;width:200%;display:flex;align-items:flex-end;animation:scroll 9s linear infinite;animation-play-state:paused}
#city i{display:block;flex:none;background:#2b3354 radial-gradient(#ffdd2d66 1px,transparent 1.6px) 0 0/9px 11px;border-radius:2px 2px 0 0}
#road{position:absolute;left:0;right:0;bottom:0;height:56px;background:#222736;border-top:3px solid #3a4258}
#road::after{content:"";position:absolute;left:0;right:0;top:26px;height:4px;background:repeating-linear-gradient(90deg,var(--y) 0 28px,transparent 28px 60px);animation:lines .5s linear infinite;animation-play-state:paused}
#van{position:absolute;left:24px;bottom:12px;width:150px}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .35s linear infinite;animation-play-state:paused}
#poi{position:absolute;right:-100px;bottom:58px;font-size:58px;filter:drop-shadow(0 4px 4px #0008)}
.drive #city,.drive #road::after,.drive .wheel{animation-play-state:running}
.drive #van{animation:bob .3s ease-in-out infinite}
.shake{animation:shake .4s}
#flash{position:absolute;inset:0;background:var(--red);opacity:0;pointer-events:none}
.hit #flash{animation:flash .5s}
@keyframes scroll{to{transform:translateX(-50%)}}
@keyframes lines{to{background-position:-60px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes flash{30%{opacity:.55}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#hud{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#161b28;border-bottom:2px solid #262d42;flex:none}
#hud .cash{font-size:22px;font-weight:700;color:var(--y);min-width:120px}
#hud small{display:block;font-size:12px;color:#9aa3bd;font-weight:400}
#bar{flex:1;height:12px;background:#2a3147;border-radius:8px;overflow:hidden}
#hp{height:100%;width:100%;background:var(--g);transition:width .5s,background .5s}
#panel{padding:16px 14px 28px;flex:1}
#panel>*{animation:pop .25s ease-out}
h2{font-size:22px;margin-bottom:4px}
.sub{color:#9aa3bd;font-size:14px;margin-bottom:12px}
.card{display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin-bottom:10px;background:var(--card);border:2px solid #2a3147;border-radius:14px;color:#fff;font:inherit;text-align:left;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{border-color:var(--y);transform:translateY(-2px);outline:none}
.card:active{transform:scale(.98)}
.ic{font-size:36px}.nm{flex:1;font-size:17px}.nm small{display:block;color:#9aa3bd;font-size:13px;margin-top:2px}
.amt{color:var(--y);font-weight:700;font-size:18px}
.ev{font-size:46px;text-align:center;margin:6px 0}
.btn{background:var(--y);color:#10131a;font-weight:700;border-radius:14px}
.btn:hover{border-color:#fff}
.coin{position:absolute;font-size:24px;pointer-events:none;z-index:5}
.big{font-size:40px;font-weight:700;color:var(--y);text-align:center;margin:8px 0}
.rank{text-align:center;color:#c9d0e6;margin-bottom:18px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>
<div id="app">
 <div id="scene"><div id="sun"></div><div id="city"></div><div id="road"></div>
  <div id="poi"></div>
  <svg id="van" viewBox="0 0 160 70"><g><rect x="4" y="10" width="110" height="40" rx="6" fill="#3a4258"/><rect x="4" y="36" width="110" height="6" fill="#ffdd2d"/><text x="14" y="30" font-size="13" font-weight="700" fill="#fff" font-family="Trebuchet MS,sans-serif">ИНКАССАЦИЯ</text><rect x="108" y="18" width="46" height="32" rx="9" fill="#4a5470"/><path d="M117 22h24l9 13h-33z" fill="#9fd8ff"/><rect x="150" y="40" width="6" height="8" rx="2" fill="#ffdd2d"/></g>
  <g class="wheel"><circle cx="34" cy="54" r="12" fill="#111"/><circle cx="34" cy="54" r="5" fill="#9aa3bd"/><rect x="33" y="43" width="2" height="22" fill="#9aa3bd"/></g>
  <g class="wheel"><circle cx="128" cy="54" r="12" fill="#111"/><circle cx="128" cy="54" r="5" fill="#9aa3bd"/><rect x="127" y="43" width="2" height="22" fill="#9aa3bd"/></g></svg>
  <div id="flash"></div></div>
 <div id="hud"><div class="cash"><span id="cash">0</span> тыс. ₽<small id="stop"></small></div><div id="bar"><div id="hp"></div></div><div id="hpn">100%</div></div>
 <div id="panel"></div>
</div>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const PLACES=[["🏧","Банкомат у метро",150,400,.2],["🏧","Банкомат в ТЦ",200,500,.25],["🏪","Магазин у дома",100,300,.2],["🛒","Рынок",400,800,.55],["⛽","АЗС на трассе",250,600,.35],["☕","Кафе в центре",150,350,.25],["🪩","Ночной клуб",500,900,.6],["💊","Аптека",100,250,.15]];
const EVENTS=[["🚗","Пробка, а точка уже ждёт."],["🕵️","Рядом крутится подозрительный тип в капюшоне."],["💥","Банкомат завис, клиент нервничает."],["🚧","Подъезд кто-то заблокировал машиной."],["🚨","Сработала сигнализация — ложная или нет?"],["🌧️","Ливень, видимость почти нулевая."]];
const RANKS=[[0,"Стажёр. Сумка пустая, зато цел."],[1000,"Новичок. Смена прошла спокойно."],[2000,"Опытный инкассатор. Начальство довольно."],[3000,"Легенда маршрута. Премия обеспечена."]];
const STOPS=8,R=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
let S,shown=0;
const dims=Array.from({length:34},()=>[R(26,52),R(34,92)]);
$('#city').innerHTML=[...dims,...dims].map(([w,h])=>`<i style="width:${w}px;height:${h}px"></i>`).join('');
function tween(from,to,ms=700){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);$('#cash').textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
function hud(){$('#stop').textContent=`Остановка ${Math.min(S.stop+1,STOPS)} из ${STOPS}`;const hp=Math.max(S.hp,0);$('#hp').style.width=hp+'%';$('#hp').style.background=hp>60?'var(--g)':hp>30?'var(--y)':'var(--red)';$('#hpn').textContent=hp+'%'}
const panel=h=>$('#panel').innerHTML=h;
const risk=r=>r<.25?'🟢 спокойно':r<.45?'🟡 так себе':'🔴 жарко';
function start(){S={stop:0,hp:100,cash:0,busy:0};shown=0;$('#cash').textContent=0;$('#poi').textContent='';hud();offer()}
function offer(){S.pts=[...PLACES].sort(()=>Math.random()-.5).slice(0,3).map(p=>[p[0],p[1],R(p[2],p[3]),p[4]]);
 panel(`<h2>Куда едем?</h2><p class="sub">Больше денег — выше риск.</p>`+S.pts.map((p,i)=>`<button class="card" onclick="pick(${i})"><span class="ic">${p[0]}</span><span class="nm">${p[1]}<small>${risk(p[3])}</small></span><span class="amt">${p[2]} тыс.</span></button>`).join(''));S.busy=0}
async function drive(ic){const sc=$('#scene'),p=$('#poi');sc.classList.add('drive');p.textContent=ic;p.style.transition='none';p.style.right='-100px';p.offsetWidth;p.style.transition='right 1.6s ease-out';p.style.right='30%';await sleep(1700);sc.classList.remove('drive')}
async function pick(i){if(S.busy)return;S.busy=1;const[ic,name,amt,rk]=S.pts[i];panel(`<p class="sub">Едем: ${name}…</p>`);await drive(ic);
 if(Math.random()<rk){S.pend=amt;const[e,t]=EVENTS[R(0,EVENTS.length-1)];
  panel(`<div class="ev">${e}</div><h2>${name}</h2><p class="sub">${t}</p><button class="card btn" onclick="resolve(1)"><span class="nm">📋 По инструкции<small style="color:#3a4258">деньги целы, но потеряешь лишнюю остановку</small></span></button><button class="card" onclick="resolve(0)"><span class="nm">⚡ Рискнуть и быстро забрать<small>60% — всё ок, 40% — удар по безопасности</small></span></button>`);S.busy=0}
 else{await collect(amt);next(1)}}
async function collect(amt){const sc=$('#scene').getBoundingClientRect(),a=$('#poi').getBoundingClientRect(),v=$('#van').getBoundingClientRect();
 for(let i=0;i<7;i++){const c=document.createElement('span');c.className='coin';c.textContent='💵';c.style.left=(a.left-sc.left+10)+'px';c.style.top=(a.top-sc.top+10)+'px';$('#scene').appendChild(c);
  c.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${v.left-a.left+60}px,${v.top-a.top}px) scale(.5)`,opacity:0}],{duration:900,delay:i*80,easing:'ease-in'}).onfinish=()=>c.remove()}
 await sleep(500);tween(S.cash,S.cash+amt);S.cash+=amt;await sleep(800)}
function hurt(n){S.hp-=n;const sc=$('#scene');sc.classList.add('shake','hit');setTimeout(()=>sc.classList.remove('shake','hit'),500);hud()}
async function resolve(safe){if(S.busy)return;S.busy=1;const amt=S.pend;
 if(safe){panel('<p class="sub">Действуешь по инструкции…</p>');await sleep(600);await collect(amt);next(2)}
 else{panel('<p class="sub">Рискуешь…</p>');await sleep(500);
  if(Math.random()<.6){await collect(amt)}else{hurt(35);await sleep(600);await collect(amt>>1)}next(1)}}
function next(n){S.stop+=n;hud();if(S.hp<=0||S.stop>=STOPS)finish();else offer()}
function finish(){const dead=S.hp<=0,cash=dead?0:S.cash,rank=dead?"Спасибо, что живой.":[...RANKS].reverse().find(r=>cash>=r[0])[1];
 panel(`<h2 style="text-align:center">${dead?'🚨 Смена сорвана':'🏁 Смена закончена'}</h2><p class="sub" style="text-align:center">${dead?'Сработала тревожная кнопка, выручку не довезли.':'Выручка сдана в хранилище.'}</p><div class="big">${cash} тыс. ₽</div><p class="rank">${rank}</p><button class="card btn" onclick="start()"><span class="nm" style="text-align:center">🔁 Ещё смена</span></button>`);
 if(dead)$('#poi').textContent='🚔'}
start();
</script></body></html>
