<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Смена инкассатора</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0}
:root{--y:#ffdd2d;--bg:#10131a;--card:#1b2030;--red:#ff4d5a;--g:#3ddc84}
body{background:var(--bg);color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column}
#scene{position:relative;height:220px;overflow:hidden;background:linear-gradient(#1d2b53,#7e4a6d 55%,#f6a05b);flex:none}
#sun{position:absolute;right:40px;top:34px;width:54px;height:54px;border-radius:50%;background:#ffd36b;box-shadow:0 0 40px #ffb347}
#city{position:absolute;left:0;bottom:56px;width:200%;display:flex;align-items:flex-end;animation:scroll 9s linear infinite;animation-play-state:paused}
#city i{display:block;flex:none;background:#2b3354 radial-gradient(#ffdd2d66 1px,transparent 1.6px) 0 0/9px 11px;border-radius:2px 2px 0 0}
#road{position:absolute;left:0;right:0;bottom:0;height:56px;background:#222736;border-top:3px solid #3a4258}
#road::after{content:"";position:absolute;left:0;right:0;top:26px;height:4px;background:repeating-linear-gradient(90deg,var(--y) 0 28px,transparent 28px 60px);animation:lines .5s linear infinite;animation-play-state:paused}
#vanbox{position:absolute;left:18px;bottom:10px;width:200px}#van{display:block;width:100%;height:auto;user-select:none}.wh{position:absolute;aspect-ratio:1;animation:spin .35s linear infinite;animation-play-state:paused}
#poi{position:absolute;right:-100px;bottom:58px;font-size:58px;filter:drop-shadow(0 4px 4px #0008)}
.drive #city,.drive #road::after{animation-play-state:running}.drive #vanbox{animation:bob .3s ease-in-out infinite}.drive .wh{animation-play-state:running!important}
.shake{animation:shake .4s}
#room{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;transition:opacity .4s}#room.on{opacity:1}#room svg.bg{width:100%;height:100%;display:block}.bub{position:absolute;left:10px;top:10px;max-width:58%;background:#fff;color:#10131a;padding:8px 10px;border-radius:12px;font-size:14px;line-height:1.25}#flash{position:absolute;inset:0;background:var(--red);opacity:0;pointer-events:none}
.hit #flash{animation:flash .5s}
@keyframes scroll{to{transform:translateX(-50%)}}
@keyframes lines{to{background-position:-60px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes flash{30%{opacity:.55}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#hud{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#161b28;border-bottom:2px solid #262d42;flex:none}
#hud .cash{font-size:22px;font-weight:700;color:var(--y);flex:1.6}#rep{font-weight:700;color:var(--y)}
#hud small{display:block;font-size:12px;color:#9aa3bd;font-weight:400}
#bar{flex:1;height:12px;background:#2a3147;border-radius:8px;overflow:hidden}
#hp{height:100%;width:100%;background:var(--g);transition:width .5s,background .5s}
#panel{padding:16px 14px 28px;flex:1}
#panel>*{animation:pop .25s ease-out}
h2{font-size:22px;margin-bottom:4px}
.sub{color:#9aa3bd;font-size:14px;margin-bottom:12px}
.card{display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin-bottom:10px;background:var(--card);border:2px solid #2a3147;border-radius:14px;color:#fff;font:inherit;text-align:left;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{border-color:var(--y);transform:translateY(-2px);outline:none}
.card:active{transform:scale(.98)}
.ic{font-size:36px}.nm{flex:1;font-size:17px}.nm small{display:block;color:#9aa3bd;font-size:13px;margin-top:2px}
.amt{color:var(--y);font-weight:700;font-size:18px}
.ev{font-size:46px;text-align:center;margin:6px 0}
.btn{background:var(--y);color:#10131a;font-weight:700;border-radius:14px}
.btn:hover{border-color:#fff}
.coin{position:absolute;font-size:24px;pointer-events:none;z-index:5}
.big{font-size:40px;font-weight:700;color:var(--y);text-align:center;margin:8px 0}
.rank{text-align:center;color:#c9d0e6;margin-bottom:18px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
#locationArt{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .4s;background:linear-gradient(#80b9de 0 65%,#555 65%)}#locationArt.on{opacity:1}#locationArt .building{position:absolute;bottom:49px;left:15%;width:70%;height:115px;background:#e8e3d5;border:5px solid #566276;border-radius:5px;box-shadow:inset 0 -18px #b2b9c4}#locationArt .sign{position:absolute;top:18px;left:22%;width:56%;background:#1678bb;border-radius:6px;text-align:center;padding:7px;font-weight:900;font-size:16px}#locationArt .door{position:absolute;bottom:49px;left:44%;width:12%;height:63px;background:#86d5e4;border:5px solid #50647d}#locationArt .windows{position:absolute;bottom:100px;left:20%;width:60%;display:flex;justify-content:space-between}#locationArt .windows i{width:22%;height:32px;background:#9bd5e7;border:4px solid #5e7188}#locationArt .mascot{position:absolute;bottom:60px;right:4%;font-size:48px;animation:bob .6s infinite}.doc{background:#f5e9c9;color:#25201a;padding:12px;border-radius:9px;margin:8px 0;border-left:5px solid #c39d51;font-size:14px;line-height:1.6}.doc strong{color:#333}.docgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.docgrid .doc{margin:0}.tag{display:inline-block;background:#313b55;padding:5px 9px;border-radius:8px;margin:3px;font-size:12px}.warn{color:#ff8b8b}.ok{color:#5be4a0}@keyframes skid{25%{transform:translateX(-12px) rotate(-3deg)}60%{transform:translateX(9px) rotate(2deg)}}.crash #vanbox{animation:skid .6s ease-in-out!important}.drive .wh{animation:spin .35s linear infinite!important}
.crewline{background:#242c3f;border-left:3px solid var(--y);border-radius:10px;padding:10px 12px;margin:10px 0 14px;display:flex;flex-direction:column;gap:5px;font-size:14px}.crewline b{color:var(--y);font-size:12px}.crewline span{line-height:1.4}.dialogue-screen{display:flex;flex-direction:column;gap:22px;min-height:180px;justify-content:space-between;padding:16px 4px}.dialogue-copy{white-space:pre-wrap;font-size:18px;line-height:1.55;color:#fff;background:#232a3b;padding:18px;border-radius:14px;border-left:3px solid var(--y)}.dialogue-screen .btn{margin-top:8px}</style><style id="daily-stats-style">.daystats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.daystats>div{background:#1b2030;border:1px solid #343d55;border-radius:12px;padding:12px 5px;text-align:center}.daystats b{display:block;font-size:22px;color:#ffdd2d}.daystats small{display:block;font-size:11px;color:#aeb8cc;margin-top:4px}.crewline{background:#242c3f;border-left:3px solid var(--y);border-radius:10px;padding:10px 12px;margin:10px 0 14px;display:flex;flex-direction:column;gap:5px;font-size:14px}.crewline b{color:var(--y);font-size:12px}.crewline span{line-height:1.4}.dialogue-screen{display:flex;flex-direction:column;gap:22px;min-height:180px;justify-content:space-between;padding:16px 4px}.dialogue-copy{white-space:pre-wrap;font-size:18px;line-height:1.55;color:#fff;background:#232a3b;padding:18px;border-radius:14px;border-left:3px solid var(--y)}.dialogue-screen .btn{margin-top:8px}</style></head><body>

async function docsChoice(choice){if(S.busy)return;S.busy=1;const d=S.doc,c=S.rt[S.i];const mismatch=[1,2,3].includes(d.type),ambiguous=[4,5,6].includes(d.type);if(choice==='call'){S.busy=0;return docsMonitoring()}
 if(choice==='accept'){if(mismatch||ambiguous){S.mistakes++;rep(-9);say('⚠️ Провели встречу без надлежащей проверки. Мониторинг фиксирует нарушение.');await sleep(1500);next(0)}else{rep(3);say('📋 Личность подтверждена. Сейф-пакет: проверка целостности, номер, акт передачи.');await sleep(1200);await collect(c.amt);next(1)}}else{if(mismatch){rep(4);say('⛔ Данные не совпадают. Правильный отказ, оформляем инцидент.')}else if(ambiguous){rep(1);say('⛔ Документ невозможно проверить. Отказ до решения мониторинга.')}else{S.mistakes++;rep(-5);say('😡 Отказ без оснований. Клиент подал жалобу.')}await sleep(1400);next(1)}}
function docsMonitoring(){const d=S.doc;panel(`<div class="ev">📞</div><h2>Cash-мониторинг</h2><p class="sub">«Слушаю. Что конкретно не сходится? ${esc(d.issue||'Данные не сходятся')}? Не фантазируй, докладывай по фактам. Мы не можем разрешить встречу без подтверждения личности».</p><button class="card" onclick="docsMonitorPick(0)"><span class="nm">📋 «Документа нет или не читается. Оформляю отказ»<small>Безопасное решение</small></span></button><button class="card" onclick="docsMonitorPick(1)"><span class="nm">😤 «Он уверяет, что всё ок. Без оригинала точно отказ?»<small>Мониторинг запрещает проводить встречу</small></span></button>`)}
async function docsMonitorPick(k){if(S.busy)return;S.busy=1;if(k)S.mistakes++;rep(k?-2:2);say(k?'📞 «Без подтверждения личности не проводим. Фиксируй отказ»':'📞 «Принято. Оформляй отказ, отметим причину в системе».');await sleep(1600);next(1)}
async function accident(){const sc=$('#scene');sc.classList.add('crash','shake','hit');say('💥 ДТП! Машину тряхнуло. Стоим, оцениваем обстановку, докладываем диспетчеру.');S.t+=R(25,55);hurt(R(12,30));rep(-2);await sleep(1900);sc.classList.remove('crash','shake','hit');say('📞 Cash-мониторинг: «Экипаж цел? Оформляйте происшествие, по маршруту скорректируем окна».');await sleep(1700)}
async function chopEvent(){
 S.t+=30;rep(-1);
 const scenes=[
  ['guard','Парни, мне очень хреново. Кажется, я обосрался.'],
  ['driver','Да ладно, блядь. Ты сейчас серьёзно?'],
  ['guard','Я не шучу. Надо связываться с мониторингом.'],
  ['driver','Окна открывать нельзя. Ден, ну ты серьёзно сейчас?'],
  ['monitor','Понял. Остановитесь в безопасном месте, двери не открывайте без согласования. Организуем замену.'],
  ['driver','Макс, просто пришли замену. У нас тут находиться невозможно.'],
  ['guard','Парни, давайте без подробностей в общий чат.']
 ];
 for(const [who,line] of scenes){say('📞 '+CREW[who].name+': «'+line+'»');await sleep(1700)}
 hud()
}
