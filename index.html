.shake{animation:shake .4s}

// Оригинальная короткая мелодия с 4-уровневой громкостью и прямоугольной волной.
let audioCtx=null,musicTimer=null,musicStep=0;
// Звук двигателя — только пока машина действительно движется.
let engineSound=null,engineUsers=0;
function startEngine(){
 if(META.soundEnabled===false)return;
 audioUnlock();engineUsers++;
 if(engineSound||!audioCtx||audioCtx.state!=='running')return;
 try{
  const ctx=audioCtx,now=ctx.currentTime,osc=ctx.createOscillator(),vibe=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();
  // Мягкий звук двигателя без тяжёлого низкочастотного гула.
  osc.type='triangle';osc.frequency.setValueAtTime(82,now);osc.frequency.exponentialRampToValueAtTime(112,now+.8);
  vibe.type='sine';vibe.frequency.setValueAtTime(164,now);vibe.frequency.exponentialRampToValueAtTime(224,now+.8);
  filter.type='lowpass';filter.frequency.value=520;filter.Q.value=.45;
  gain.gain.setValueAtTime(.001,now);gain.gain.linearRampToValueAtTime(.018,now+.25);
  osc.connect(filter);vibe.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
  osc.start();vibe.start();engineSound={osc,rumble:vibe,gain};
 }catch(e){engineSound=null}
}
function stopEngine(){
 engineUsers=Math.max(0,engineUsers-1);
 if(engineUsers||!engineSound)return;
 const sound=engineSound;engineSound=null;
 try{const now=audioCtx.currentTime;sound.gain.gain.cancelScheduledValues(now);sound.gain.gain.setValueAtTime(Math.max(.001,sound.gain.gain.value),now);sound.gain.gain.exponentialRampToValueAtTime(.001,now+.2);sound.osc.stop(now+.23);sound.rumble.stop(now+.23)}catch(e){}
}
function stopAllEngine(){engineUsers=1;stopEngine()}

function audioUnlock(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!audioCtx)audioCtx=new A();if(audioCtx.state==='suspended')audioCtx.resume();if(!musicTimer)musicTimer=setInterval(musicTick,220)}catch(e){}}
function tone(freq,dur,vol=.035,type='square'){
 if(!audioCtx||audioCtx.state!=='running')return;
 try{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(vol,now);gain.gain.setValueAtTime(vol*.5,now+dur*.6);gain.gain.setValueAtTime(0,now+dur);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+dur+.005)}catch(e){}
}
// Короткие звуки рабочего окружения: воспроизводятся только при действии игрока.
function workSound(kind){
 if(META.soundEnabled===false)return;
 audioUnlock();
 if(!audioCtx||audioCtx.state!=='running')return;
 const now=audioCtx.currentTime;
 function blip(f,d,delay=0,v=.018,type='sine',end=f){
  try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=now+delay;
   o.type=type;o.frequency.setValueAtTime(f,t);if(end!==f)o.frequency.exponentialRampToValueAtTime(Math.max(1,end),t+d);
   g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);
   o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+d+.015)}catch(e){}
 }
 if(kind==='kic'){
  // Короткий гул счётной машинки и сухой щелчок при выдаче документов.
  for(let i=0;i<7;i++)blip(155+(i%3)*28,.043,i*.055,.012,'sawtooth',115);
  blip(760,.06,.43,.019,'triangle',430);
 }else if(kind==='atm'){
  // Банкомат: два электронных сигнала и короткий привод кассетного механизма.
  blip(880,.10,0,.022,'sine');blip(1175,.11,.15,.018,'sine');
  for(let i=0;i<5;i++)blip(135+i*17,.055,.32+i*.07,.009,'triangle',90);
 }else if(kind==='notification'){
  blip(784,.10,0,.026,'sine');blip(1046,.12,.14,.028,'sine');blip(1318,.20,.31,.022,'sine');
 }else if(kind==='scan'){
  blip(920,.075,0,.019,'sine');blip(1350,.085,.095,.017,'sine');
 }else if(kind==='paper'){
  for(let i=0;i<4;i++)blip(280+i*65,.028,i*.038,.010,'triangle',130);
 }else if(kind==='success'){
  blip(660,.095,0,.020,'sine');blip(990,.15,.11,.022,'sine');
 }else if(kind==='warning'){
  blip(260,.12,0,.018,'triangle');blip(220,.17,.16,.018,'triangle');
 }
}
function musicTick(){if(!META.musicEnabled||!audioCtx||audioCtx.state!=='running')return;if(document.hidden||!document.body.classList.contains('title-screen'))return;
 const notes=[262,330,392,330,294,349,440,349,262,330,392,523,440,392,330,294];
 const bass=[131,131,147,147,175,175,147,147];
 const n=musicStep++;
 if(n%2===0)tone(notes[n%16],.16,.018);
 if(n%4===0)tone(bass[Math.floor(n/4)%8],.31,.011,'triangle');
}
function buttonImpact(){
 if(META.soundEnabled===false)return;
 audioUnlock();
 // Двухтональный короткий «щелчок» с мягкой атакой.

 if(audioCtx&&audioCtx.state==='running'){
  try{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;
  osc.type='triangle';osc.frequency.setValueAtTime(660,now);osc.frequency.exponentialRampToValueAtTime(280,now+.065);
  gain.gain.setValueAtTime(.001,now);gain.gain.linearRampToValueAtTime(.033,now+.006);
  gain.gain.exponentialRampToValueAtTime(.001,now+.07);
  osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.075)}catch(e){}
 }
}

function typeText(el,text){if(!el)return;el.textContent='';let pos=0;const chars=Array.from(text);const speed=22;
 const timer=setInterval(()=>{if(!el.isConnected){clearInterval(timer);return}for(let k=0;k<2&&pos<chars.length;k++){el.textContent+=chars[pos];if(!/\s/.test(chars[pos]))typingBeep(pos);pos++}if(pos>=chars.length)clearInterval(timer)},speed);
 el.onclick=()=>{if(pos<chars.length){clearInterval(timer);el.textContent=text;pos=chars.length}}
}

 })}

function campaignChoose(day,i){
 const c=campaign();if(c.done.includes(day))return afterShift();
 const ev=CAMPAIGN_EVENTS[day],ch=ev.choices[i];if(!ch)return;
 const effects=ch[1];for(const [k,v] of Object.entries(effects)){
 if(k==='crew'||k==='monitor'||k==='management'||k==='pm')META.relations[k]=(META.relations[k]||0)+v;
 else if(k==='lena')META.relations.management=(META.relations.management||0)+v;
 else if(k==='promise')META.promises.push('Поддержать Саню до конца разбирательства');
 else if(k==='crime'||k==='confessed')c[k]=v;
 else c[k]=(c[k]||0)+v;
 }
 c.done.push(day);addChronicle(`${ev.title}: ${ch[0]}. ${ch[2]}`);
 META.messages.push([ev.speaker+' · после смены',ch[2]]);saveMeta();
 panel(`<h2>Последствия решения</h2><div class="msg"><small>${esc(ev.speaker)}</small>${esc(ch[2])}</div><p class="sub">Выбор сохранён. Его последствия могут проявиться спустя несколько смен.</p><button class="card btn" onclick="afterShift()">🌙 Продолжить вечер</button>`)

function campaignFinal(){
 const c=campaign();if(c.final)return showCareerEnding();
 const crew=META.relations.crew||0,mg=META.relations.management||0,mon=META.relations.monitor||0;
 let id='honest';
 if(c.crime==='involved'){
   if(c.confessed)id='confession';
   else if(c.risk>=5||c.evidence>=9)id='caught';
   else id='doublelife';
 }else if(c.crime==='reported'&&c.evidence>=8)id='whistleblower';
 else if(c.freedom>=5)id='leave';
 else if(c.careerMonitor>=3&&mon>=1)id='monitor';
 else if(c.career>=4&&mg>=1&&crew>=0&&c.integrity>=2)id='promotion';
 else if(c.evidence>=9&&c.integrity>=5)id='investigator';
 else if(crew<=-3)id='transfer';
 c.final=id;META.careerEnding=id;
 addChronicle('Финал шестинедельной истории: '+ENDINGS[id][0]);saveMeta();showCareerEnding()
}

// Перемешиваем только ответы внутри одного вопроса, не меняя привязку к обработчикам.
function mixDecisionButtons(el){
 const handlers=['kicPick','resolve','callOpt','storyChoice','campaignChoose','docsChoice','docsMonitorPick','atmCheckPick','submitVote'];
 const buttons=[...el.querySelectorAll('button[onclick]')];
 const groups=new Map();
 for(const b of buttons){
  const action=b.getAttribute('onclick')||'';
  const handler=handlers.find(h=>action.startsWith(h+'('));
  if(!handler)continue;
  if(!groups.has(handler))groups.set(handler,[]);
  groups.get(handler).push(b);
  // Подсказки с последствиями не показываем до принятия решения.
  b.querySelectorAll('small').forEach(t=>t.remove());
 }
 for(const group of groups.values()){
  if(group.length<2)continue;
  const slots=group.map(b=>{const marker=document.createComment('choice-slot');b.parentNode.insertBefore(marker,b);return marker});
  const shuffled=[...group];
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(gameRandom()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}
  slots.forEach((marker,i)=>{marker.parentNode.replaceChild(shuffled[i],marker)});
 }
}

 for(let i=cells.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
 return cells.slice(0,NS)
}

function absentMonitorCall(){if(S.rt[S.i]?.storyAbsent)return firstDayMonitor();S.t+=5;panel(`<h2>📞 Cash-мониторинг</h2><p class="sub"><b>Ты:</b> «На точке. Клиента нет, связи нет. Как действуем?»</p><p class="sub"><b>Cash-мониторинг:</b> «Принял. Сейчас связываюсь с ПМ. Ждите обратного звонка, решение зафиксирую».</p><button class="card btn" onclick="absentPmReply()"><span class="nm">⏳ Дождаться ответа мониторинга</span></button>`)}
function incomingCall(who,message,answer,callback){try{audioUnlock();if(META.soundEnabled!==false){const ctx=window.audioCtx||window.AC||null;if(ctx&&ctx.createOscillator){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=740;g.gain.value=.045;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.3)}}}catch(e){}const el=$('#overlay');el.classList.add('open','phone-mode');el.innerHTML=`<style>@keyframes callShake{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}</style><div class="phone-shell" style="text-align:center;padding:30px 14px"><div style="font-size:66px;animation:callShake .18s infinite alternate">📱</div><h2>Входящий звонок</h2><h3>${esc(who)}</h3><p>${esc(message)}</p><button class="card btn" onclick="${callback}">📞 ${esc(answer)}</button></div>`}
function firstDayMonitor(){S.t+=4;S.clientAbsence=true;panel(`<h2>📞 Cash-мониторинг</h2><p class="sub"><b>${esc(safeName())} · инкассатор:</b> «Вторая точка. Клиент не отвечает, на месте никого».</p><p class="sub"><b>Cash-мониторинг:</b> «Принял. Пока как отказ не закрывайте. Езжайте дальше, выясним через ПМ. Третья точка — банкомат».</p><button class="card btn" onclick="firstDaySkip()">🚐 Ехать на третью точку</button>`)}
function firstDaySkip(){S.rt[1].status='pending';S.storyReturnPending=true;S.failedStops.push(1);S.shiftLog.push({kind:'pending',text:'ФЛ на второй точке не вышел на связь; заявка оставлена открытой',resolved:true});S.t+=4;S.i++;hud();proceed()}
function storyReturnCall(){S.storyReturnCalled=true;S.monitorCalls++;S.t+=3;incomingCall('Cash-мониторинг','Клиент со второй точки вышел на связь. Готов принять доставку в 17:00. Посмотрите карту и выберите банкоматы, которые можно снять с маршрута, чтобы успеть к физлицам. После выбора позвоните нам — согласуем изменения.','Открыть карту','openPlanner()')}
function plannerOptions(){return S.rt.slice(S.i).filter(c=>!c.priv&&c.status!=='cancelled'&&!c.storyAbsent)}
function plannerEvaluate(){const pending=S.rt.find(c=>c.storyAbsent);if(!pending)return null;const rest=S.rt.slice(S.i).filter(c=>!c.storyAbsent&&!S.plannerRemoved?.includes(c.routeId));let best=null;for(let k=0;k<=rest.length;k++){const order=[...rest];order.splice(k,0,pending);let t=S.t,late=0,arrive=0;for(const c of order){t+=18;const opening=c.storyAbsent?1020:c.a;t=Math.max(t,opening);if(c.storyAbsent){arrive=t;if(t>1050)late++}else if(c.priv&&t>c.a+30)late++;t+=c.priv?10:8}const candidate={order,late,arrive,k};if(!best||candidate.late<best.late||(candidate.late===best.late&&Math.abs(candidate.arrive-1020)<Math.abs(best.arrive-1020)))best=candidate}return best}
function openPlanner(){closeOverlay();S.plannerRemoved=S.plannerRemoved||[];S.rt.forEach((c,i)=>{if(c.routeId===undefined)c.routeId=i});renderPlanner()}
function plannerToggle(id){S.plannerRemoved=S.plannerRemoved||[];if(S.plannerRemoved.includes(id))S.plannerRemoved=S.plannerRemoved.filter(x=>x!==id);else S.plannerRemoved.push(id);renderPlanner()}
function renderPlanner(){const selected=S.plannerRemoved||[],evalResult=plannerEvaluate();const rows=S.rt.map((c,i)=>{const current=i<S.i,chosen=selected.includes(c.routeId),waiting=c.storyAbsent;const icon=c.priv?'🏠 ФЛ':'🏧 Банкомат';const label=`${i+1}. ${icon} · ${esc(c.name)} · ${fmt(waiting?1020:c.a)}–${fmt((waiting?1020:c.a)+30)}`;return `<div style="padding:8px;border-bottom:1px solid #47606e;opacity:${current?'.5':'1'}">${!current&&!c.priv&&!waiting?`<button class="card ${chosen?'btn':''}" style="margin:0;padding:8px" onclick="plannerToggle(${c.routeId})">${chosen?'☑ СНЯТЬ':'☐ ОСТАВИТЬ'} · ${label}</button>`:`${label} ${waiting?'🔴 ожидает повторного заезда':current?'✅ выполнена':''}`}</div>`}).join('');const estimate=evalResult?`<p class="sub">Расчёт: ФЛ №2 — ${fmt(evalResult.arrive)} · опозданий к ФЛ: ${evalResult.late} · банкоматов на снятие: ${selected.length}</p>`:'';panel(`<h2>🗺️ Корректировка маршрута</h2><p class="sub">Cash-мониторинг предварительно согласовал снятие до трёх банкоматов. Выберите на карте банкоматы, которые хотите передать другому экипажу, чтобы успеть к ФЛ. Остальные встречи с физлицами сохраняются.</p><div class="doc">🏠 ФЛ №2 · 17:00–17:30 · заявка открыта</div><div class="route-map-art">${mapArtwork(Math.min(S.i,NS-1),0,true)}</div><p class="sub">Нажимайте на номера банкоматов на карте или в списке ниже.</p><div style="max-height:230px;overflow:auto;background:#233c4b">${rows}</div>${estimate}<button class="card btn" onclick="plannerCallMonitoring()">📞 Позвонить в Cash-мониторинг и согласовать</button>`)}
function plannerCallMonitoring(){const result=plannerEvaluate();if(!result)return proceed();if(result.late>0){panel(`<h2>📞 Cash-мониторинг</h2><p class="sub">«По расчёту опозданий к физлицам: ${result.late}. Так не согласуем. Вернитесь на карту и снимите ещё банкоматы. Встречи с ФЛ переносить нельзя».</p><button class="card btn" onclick="renderPlanner()">🗺️ Вернуться к карте</button>`);return}S.planConfirmed=result;const n=(S.plannerRemoved||[]).length;if(n>3){panel(`<h2>📞 Cash-мониторинг</h2><p class="sub">«Ай-ай-ай. Мы согласовали снять три банкомата, а у вас ${n}. Фрод — это плохо. За самовольное снятие лишних точек будет замечание и минус репутация. Маршрут всё равно успеваем перестроить, но нарушение зафиксирую».</p><button class="card btn" onclick="plannerAcceptOverLimit()">⚠️ Принять маршрут с замечанием</button><button class="card" onclick="renderPlanner()">↩ Вернуться и исправить выбор</button>`);return}panel(`<h2>📞 Cash-мониторинг</h2><p class="sub">«Вижу корректировку. ${n?`Снимаем ${n} ${n===1?'банкомат':n<5?'банкомата':'банкоматов'} с вашего маршрута, передадим другому экипажу.`:'Банкоматы снимать не требуется.'} Окна остальных ФЛ соблюдаются. Вторую точку ставим на ${fmt(result.arrive)}. Подтверждаю».</p><button class="card btn" onclick="applyPlanner()">✅ Принять маршрут и продолжить смену</button><button class="card" onclick="renderPlanner()">↩ Изменить выбор</button>`)}
function plannerAcceptOverLimit(){if(!S.plannerFraudPenalty){S.plannerFraudPenalty=true;S.mistakes++;rep(-8);S.shiftLog.push({kind:'route',text:'Самовольно снято больше трёх банкоматов; Cash-мониторинг зафиксировал нарушение',resolved:true})}applyPlanner()}
function applyPlanner(){const result=S.planConfirmed;if(!result)return renderPlanner();const removed=S.plannerRemoved||[];const original=S.rt.slice(S.i);const deferred=original.filter(c=>removed.includes(c.routeId));deferred.forEach(c=>c.status='cancelled');const stop=S.rt.find(c=>c.storyAbsent);stop.a=1020;stop.storyAbsent=false;stop.returnVisit=true;stop.status='scheduled';S.rt.splice(S.i,S.rt.length-S.i,...result.order,...deferred);S.storyRoutePlanned=true;S.pendingCallback=false;S.callbackDone=true;S.shiftLog.push({kind:'route',text:`Cash-мониторинг согласовал повторный заезд к ФЛ №2; снято банкоматов: ${removed.length}`,resolved:true});hud();proceed()}
function absentPmReply(){S.t+=R(8,17);const variant=R(0,2);S.pmAnswer=variant;const pm=[

function absentResolution(i){if(i===0){S.t+=10;if(gameRandom()<.42){panel(`<h2>Клиент вышел на связь</h2><p class="sub">После согласования с мониторингом клиент появился. Теперь нужно проверить документы.</p><button class="card btn" onclick="docsStart()"><span class="nm">🪪 Проверить документы</span></button>`)}else{panel(`<h2>📞 Повторный звонок</h2><p class="sub">Cash-мониторинг: «ПМ опять обещал перезвонить. Не держу вас дальше. Отсутствие зафиксировано, следующая точка по утверждённому маршруту».</p><button class="card btn" onclick="absentResolution(1)"><span class="nm">➡️ Продолжить маршрут</span></button>`)}return}S.skipped++;rep(1);S.t+=4;S.pendingCallback=true;S.callbackDue=Math.min(NS,S.i+R(2,4));S.i++;hud();proceed()}

async function atmStartWork(){if(S.busy)return;S.busy=1;const c=S.rt[S.i];if(!c.atmLockType)c.atmLockType=gameRandom()<.5?'kaba':'limb';const code=c.atmLockCode||(c.atmLockType==='kaba'?String(R(1000,9999)):`${R(10,99)} ${R(10,99)} ${R(10,99)}`);c.atmLockCode=code;S.atmLock={active:true,type:c.atmLockType,code,atmId:c.atmId||'0000',atmName:c.name,batteryChecked:false,attempts:0};S.busy=0;renderAtmLock();setTimeout(showAtmCodePush,650)}

function showAtmCodePush(){
 const a=S?.atmLock;if(!a||!a.active||a.pushShown)return;
 a.pushShown=true;
 const msg=`🏧 АТМ ${a.atmId} ${a.type==='kaba'?'KABA КОД':'ЛИМБОВЫЙ КОД'} ${a.code}`;
 const el=document.createElement('div');el.id='atm-code-push';el.setAttribute('role','status');
 el.setAttribute('aria-live','polite');el.innerHTML=`<strong>📩 Cash-мониторинг · новое сообщение</strong><span>${esc(msg)}</span><small>Нажми, чтобы открыть переписку</small>`;
 document.getElementById('atm-code-push')?.remove();document.body.appendChild(el);
 el.onclick=()=>{dismissAtmCodePush();openChat('max')};
 workSound('notification');
 if(navigator.vibrate)try{navigator.vibrate([75,45,75])}catch(e){}
 clearTimeout(atmPushTimer);atmPushTimer=setTimeout(dismissAtmCodePush,6500);
}
function dismissAtmCodePush(){clearTimeout(atmPushTimer);document.getElementById('atm-code-push')?.remove()}
